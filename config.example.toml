# germ configuration — copy to ~/.config/germ/config.toml
# Changes are applied live when you save (theme, colors, font, padding, keybindings).

# A bundled theme (run `germ -list-themes`), a theme in ~/.config/germ/themes/<name>.toml,
# or a path to a theme file.
theme = "tokyonight"

[font]
family = "monospace"   # any fontconfig name, e.g. "JetBrainsMono Nerd Font"
size = 11.0            # points

[window]
padding = 4            # pixels (scaled for HiDPI)
columns = 100          # initial size
rows = 30

[scrollback]
lines = 10000

[shell]
# program = "/usr/bin/fish"   # default: $SHELL
# args = ["--login"]
# term = "xterm-256color"     # default: "xterm-germ" (installed automatically)

# Override individual theme colors.
[colors]
# background = "#1a1b26"
# foreground = "#c0caf5"
# cursor = "#c0caf5"
# cursor_text = "#1a1b26"
# selection_foreground = "#c0caf5"
# selection_background = "#33467c"
# normal = ["#15161e", "#f7768e", "#9ece6a", "#e0af68", "#7aa2f7", "#bb9af7", "#7dcfff", "#a9b1d6"]
# bright = ["#414868", "#f7768e", "#9ece6a", "#e0af68", "#7aa2f7", "#bb9af7", "#7dcfff", "#c0caf5"]

[shell_integration]
mode = "auto"          # "auto" injects prompt marks for fish; "off" disables

[tmux]
enabled = true         # every window is a tmux session in control mode (tabs and splits become native)
# session = "main"     # always use this session; default: a free germ, germ-2, ... per window
# socket = "germ"      # tmux -L socket name (default server if unset)

[home]
enabled = true          # the first tab is a dashboard of widgets (docs/widgets.md)
focus_on_start = true
layout = [["clock", "weather", "agents"], ["news:3", "stocks:2"]]   # rows; ":N" = relative width
row_heights = [2, 3]

# Widget options; any key besides command/interval reaches the widget as
# GERM_WIDGET_<KEY>. Custom widgets: set command, or drop an executable in
# ~/.config/germ/widgets/NAME.
# [widgets.weather]
# location = "Denver"    # default: from your IP address
# units = "celsius"
# [widgets.stocks]
# symbols = ["AAPL", "NVDA", "BTC-USD"]
# [widgets.news]
# feeds = ["https://hnrss.org/frontpage"]
# [widgets.todo]
# command = "cat ~/todo.txt"
# interval = "30s"

[agents]
# Processes treated as coding agents (tab badges, agents widget, notifications).
commands = ["claude", "codex", "aider", "gemini", "opencode", "goose", "amp", "cursor-agent", "crush", "qwen", "copilot"]
notify = true           # desktop notification when an agent needs you
# Matched against the bottom of an agent's screen (case-insensitive):
# working_patterns = ["esc to interrupt", "ctrl+c to interrupt", "esc to cancel"]
# waiting_patterns = ["do you want to", "would you like to", "❯ 1. yes", "(y/n)", ...]
shift_enter_newline = true          # Shift+Enter inserts a newline in agent panes
launch = ["claude", "{task}"]       # what Ctrl+Shift+A / `germ agent` runs
resume = ["claude", "--continue"]   # "resume" in the post-agent menu
# worktrees = "~/worktrees/{repo}"  # default: {repo}.worktrees beside the repo

[control]
enabled = true          # control socket for `germ ctl` / `germ mcp` (docs/agents.md)
allow_input = true      # let clients type into panes and open new ones

[share]
mode = "auto"            # how guests reach you: auto (direct via UPnP, else a free Cloudflare tunnel), direct, tunnel
# port = 7681            # fixed port for direct links (default: any free one)
# public_address = "me.example.com"     # you forward the port yourself; skips UPnP
# relay = "https://relay.example.com"  # use your own relay server instead (docs/coworking.md)

# Key bindings: "chord" = "action". Use "none" to remove a default.
# Actions: copy, paste, paste_primary, zoom_in, zoom_out, zoom_reset,
#   scroll_page_up, scroll_page_down, scroll_top, scroll_bottom,
#   previous_prompt, next_prompt, copy_last_output,
#   new_tab, close_tab, next_tab, previous_tab, split_right, split_down,
#   close_pane, focus_left, focus_right, focus_up, focus_down,
#   toggle_pane_zoom, detach, reload_config
[keybindings]
# "ctrl+shift+c" = "copy"
# "ctrl+shift+v" = "paste"
# "shift+insert" = "none"
