# Fly.io config for germ's relay. Deploy with deploy/relay/deploy.sh,
# which picks the app name and keeps it to one machine (rooms live in
# memory, so hosts and guests must reach the same instance).
app = "germ-relay"            # overridden by deploy.sh --app
primary_region = "ewr"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"   # sleeps when nobody is sharing
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    soft_limit = 500
    hard_limit = 1000

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
